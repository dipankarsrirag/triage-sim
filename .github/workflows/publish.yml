# Build and publish triagesim to PyPI when a GitHub Release is published.
# Uses PyPI Trusted Publishing (OIDC) — no API token needs to be stored as a secret.
# One-time setup at https://pypi.org/manage/project/triagesim/settings/publishing/:
#   owner: dipankarsrirag | repo: triage-sim | workflow: publish.yml | environment: pypi

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Build sdist and wheel
      run: |
        python -m pip install --upgrade pip build
        python -m build

    - name: Check distributions
      run: |
        python -m pip install twine
        twine check dist/*

    - uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for Trusted Publishing
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
